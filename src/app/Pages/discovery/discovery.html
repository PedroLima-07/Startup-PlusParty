<header class="app-header">
  <div class="header-content">
    <h1>Descobrir</h1>
  </div>
</header>

<main class="page-content">
  <label class="search-box" for="busca-bar">
    <span class="search-icon" aria-hidden="true">⌕</span>
    <input
      id="busca-bar"
      type="search"
      [(ngModel)]="busca"
      placeholder="Buscar bar pelo nome"
      autocomplete="off"
      enterkeyhint="search"
    />
  </label>

  @if (carregando()) {
    <app-carregando texto="Carregando bares" />
  } @else if (erroCarregar()) {
    <app-erro-carregar
      mensagem="Não foi possível carregar os bares. Verifique sua conexão."
      (tentarDeNovo)="carregar()"
    />
  } @else {
    <div class="bars-list">
      @for (estabelecimento of estabelecimentosFiltrados; track estabelecimento.id) {
        @let foto = estabelecimento.foto_url;
        <button
          type="button"
          class="bar-card"
          [class.com-foto]="foto"
          (click)="abrirPerfil(estabelecimento)"
        >
          @if (foto) {
            <img class="bar-foto" [src]="foto" alt="" loading="lazy" />
          } @else {
            <span class="bar-avatar" aria-hidden="true">{{ iniciais(estabelecimento.nome) }}</span>
          }

          <span class="bar-info">
            <span class="bar-name">{{ estabelecimento.nome }}</span>
            <span class="bar-description">{{ estabelecimento.descricao }}</span>
            <app-nota-bar [nota]="estabelecimento.avaliacao" />
          </span>

          @if (!foto) {
            <span class="card-chevron" aria-hidden="true">›</span>
          }
        </button>
      } @empty {
        <div class="empty-state">
          <span class="empty-icon" aria-hidden="true">⌕</span>
          <p>Nenhum bar encontrado.</p>
          <small>Tente buscar por outro nome.</small>
        </div>
      }
    </div>
  }
</main>

<app-nav-cliente />
