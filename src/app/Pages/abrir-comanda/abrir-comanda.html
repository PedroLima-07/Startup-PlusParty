<header class="app-header">
  <div class="header-content">
    <h1>Abrir comanda</h1>
  </div>
</header>

<main class="page-content">
  <section class="intro-section">
    <h2>Onde você está?</h2>
    <p class="subtitulo">Escolha o local para abrir sua comanda na casa.</p>
  </section>

  <section class="opcoes-local" aria-label="Tipo de local">
    <button
      type="button"
      class="opcao-local"
      [class.selecionada]="tipoLocal() === 'mesa'"
      (click)="selecionarTipo('mesa')"
    >
      <span class="icone-local" aria-hidden="true">M</span>
      <span class="rotulo-local">Mesa</span>
      <span class="descricao-local">Sentado na mesa</span>
    </button>

    <button
      type="button"
      class="opcao-local"
      [class.selecionada]="tipoLocal() === 'balcao'"
      (click)="selecionarTipo('balcao')"
    >
      <span class="icone-local" aria-hidden="true">B</span>
      <span class="rotulo-local">Balcão</span>
      <span class="descricao-local">No balcão do bar</span>
    </button>
  </section>

  @if (tipoLocal() === 'mesa') {
    <label class="campo-mesa" for="numero-mesa">
      <span>Número da mesa</span>
      <input
        id="numero-mesa"
        type="text"
        inputmode="numeric"
        [value]="numeroMesa()"
        placeholder="Ex: 12"
        autocomplete="off"
        (input)="numeroMesa.set($any($event.target).value)"
      />
    </label>
  }

  <footer class="rodape">
    <button class="botao-abrir" type="button" [disabled]="!podeAbrir" (click)="abrir()">
      Abrir comanda
    </button>
  </footer>
</main>
