<div class="login-container">
  <div class="login-box">
    <h1>Login do Gerente</h1>
    <form (ngSubmit)="entrar()">
      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="gerente@bar.com" />
      </div>
      <div class="input-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" [(ngModel)]="senha" required placeholder="******" />
      </div>
      <button type="submit" [disabled]="!email || !senha">Entrar</button>
    </form>
  </div>
</div>
